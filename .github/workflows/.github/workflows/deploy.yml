name:  Build and Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets::DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name:  Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tucn-cc-frontend:latest
          build-args: |
            REACT_APP_API_BASE=${{ vars.REACT_APP_API_BASE }}
            REACT_APP_COGNITO_AUTHORITY=${{ vars.REACT_APP_COGNITO_AUTHORITY }}
            REACT_APP_COGNITO_CLIENT_ID=${{ vars.REACT_APP_COGNITO_CLIENT_ID }}
            REACT_APP_COGNITO_DOMAIN=${{ vars.REACT_APP_COGNITO_DOMAIN }}
            REACT_APP_OIDC_REDIRECT_URI=${{ vars.REACT_APP_OIDC_REDIRECT_URI }}
            REACT_APP_LOGOUT_URI=${{ vars.REACT_APP_LOGOUT_URI }}
            REACT_APP_OIDC_SCOPE=${{ vars.REACT_APP_OIDC_SCOPE }}

      - name: 🛠️ Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tucn-cc-backend:latest
